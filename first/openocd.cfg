# OpenOCD 配置 —— 针对 STM32F103C8T6 (Blue Pill, STM32F1 系列)
# 本文件由 stm32_dev_env 环境自动放置。更换硬件时，注释/取消对应行即可。

# ---------- 选择烧录器 (interface) ----------
# ST-Link 是最常用的下载器（F1 蓝 Pill 通常用 ST-Link V2）
source [find interface/stlink.cfg]
# 若下载器是 CMSIS-DAP（达妙板等），注释上一行、取消下一行：
# source [find interface/cmsis-dap.cfg]

# ---------- 选择芯片型号 (target) ----------
# STM32F1 系列使用 stm32f1x.cfg
source [find target/stm32f1x.cfg]
# source [find target/stm32f4x.cfg]
# source [find target/stm32H7x.cfg]
